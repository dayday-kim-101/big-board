name: 재료정리 일별 수집

on:
  workflow_dispatch: {}
  schedule:
    # 평일 21시대(KST) 재시도 창 — 12:00~13:40 UTC 20분 간격(= 21:00~22:40 KST).
    # GitHub 예약 실행은 정시에 부하가 몰리면 지연되거나 드물게 누락되므로(정시 1회는 위험),
    # 여러 번 띄워 한 번이라도 성공하게 한다. 스크립트가 멱등이라 그날 첫 성공 1회만 수집·커밋하고
    # 이후 호출은 '이미 수집됨'으로 즉시 종료한다(중복 커밋 없음).
    # 공휴일은 스크립트가 처리: 네이버 거래일 ≠ 오늘이면 휴장으로 보고 미작성(임시공휴일까지 자동 대응).
    - cron: "0,20,40 12 * * 1-5"
    - cron: "0,20,40 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: jaelyo-snapshot
  cancel-in-progress: false

jobs:
  jaelyo:
    runs-on: ubuntu-latest
    # 멈춘 호출이 러너를 점유하지 않도록 백스톱(개별 fetch 타임아웃은 _jaelyo-core).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 재료정리 수집
        # KRX 공개 데이터라 인증·시크릿 불필요.
        run: node scripts/jaelyo-snapshot.mjs

      - name: 변경 시 커밋
        run: |
          if [ -n "$(git status --porcelain data/jaelyo)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/jaelyo
            git commit -m "chore: 재료정리 수집 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
