name: 재료정리 일별 수집

on:
  workflow_dispatch: {}
  schedule:
    # 평일 12:00 UTC = 21:00 KST — 장 마감(15:30 KST) 후 당일 내용 갱신.
    # 공휴일은 스크립트가 처리한다: 네이버 거래일 ≠ 오늘이면 휴장으로 보고 미작성
    #  → 하드코딩 공휴일 달력 없이 임시공휴일까지 자동 대응.
    # GitHub 스케줄은 분 단위 정밀도가 낮아 ±수분 지연될 수 있음(수동 dispatch로 보완).
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: jaelyo-snapshot
  cancel-in-progress: false

jobs:
  jaelyo:
    runs-on: ubuntu-latest
    # 멈춘 호출이 러너를 점유하지 않도록 백스톱(개별 fetch 타임아웃은 _jaelyo-core).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 재료정리 수집
        # KRX 공개 데이터라 인증·시크릿 불필요.
        run: node scripts/jaelyo-snapshot.mjs

      - name: 변경 시 커밋
        run: |
          if [ -n "$(git status --porcelain data/jaelyo)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/jaelyo
            git commit -m "chore: 재료정리 수집 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
