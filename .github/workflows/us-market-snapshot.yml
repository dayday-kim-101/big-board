name: 미국증시 일별 수집

on:
  workflow_dispatch: {}
  schedule:
    # 미국 정규장 마감 후 KST 06:30 수집.
    # UTC 월~금 21:30 = KST 화~토 06:30.
    # KST 오늘 새벽에 마감된 미국장은 KST 어제 국내증시 날짜에 맞춰 저장한다.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: us-market-snapshot
  cancel-in-progress: false

jobs:
  us-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 미국증시 수집
        run: node scripts/us-market-snapshot.mjs --target=yesterday-kst

      - name: 변경 시 커밋
        run: |
          if [ -n "$(git status --porcelain data/us-market)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/us-market
            git commit -m "chore: 미국증시 수집 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
