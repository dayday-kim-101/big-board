name: 가격 스냅샷

on:
  workflow_dispatch: {}
  schedule:
    # UTC 기준, 평일. KR 장(00:00–06:30 UTC) + US 장(13:30–21:00 UTC) 대략 커버.
    # GitHub 스케줄은 분 단위 정밀도가 낮아 ±수분 지연될 수 있음(즉시성은 수동 새로고침이 담당).
    - cron: "*/10 0-7,13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 시세 수집
        run: node scripts/snapshot.mjs

      - name: 변경 시 커밋
        run: |
          if [ -n "$(git status --porcelain public/data/prices/latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/prices/latest.json
            git commit -m "chore: 가격 스냅샷 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
